<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFC 魔法唱片機</title>
    <style>
        :root {
            --bg-color: #f0f0f2;
            --player-color: #34495e;
            --record-color: #1a1a1a;
        }

        body {
            margin: 0; padding: 0; height: 100vh;
            background-color: var(--bg-color);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: sans-serif; overflow: hidden;
            perspective: 1200px;
        }

        /* 3D 唱機基座 */
        .turntable-base {
            width: 300px; height: 300px;
            background-color: var(--player-color);
            border-radius: 15px;
            position: relative;
            transform: rotateX(20deg) rotateY(-5deg);
            transform-style: preserve-3d;
            box-shadow: 20px 40px 60px rgba(0,0,0,0.3), inset -2px -2px 5px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.3s;
        }

        .turntable-base:active { transform: rotateX(15deg) rotateY(-3deg) scale(0.98); }

        /* 黑膠唱盤 */
        .platter {
            width: 260px; height: 260px;
            background: radial-gradient(circle, #333 0%, #000 70%);
            border-radius: 50%;
            position: absolute;
            top: 20px; left: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
            transform: translateZ(20px);
            border: 2px solid #222;
        }

        /* 唱片標籤 */
        .label {
            width: 80px; height: 80px;
            background: linear-gradient(45deg, #e74c3c, #ff5e62);
            border-radius: 50%;
            position: absolute;
            top: 90px; left: 90px;
            border: 2px solid #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: white; font-weight: bold;
        }

        /* 唱盤轉動 */
        .spinning { animation: spin 3s linear infinite; }
        @keyframes spin { 100% { transform: translateZ(20px) rotate(360deg); } }

        /* 唱臂 */
        .tonearm {
            width: 15px; height: 180px;
            background: linear-gradient(90deg, #bdc3c7, #95a5a6);
            position: absolute;
            top: 30px; right: 40px;
            border-radius: 10px;
            transform-origin: top center;
            transform: translateZ(40px) rotate(20deg);
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 5px 5px 10px rgba(0,0,0,0.3);
        }

        /* 啟動後的唱臂位置 */
        .playing .tonearm { transform: translateZ(40px) rotate(-15deg); }

        .status-msg { margin-top: 50px; color: #555; font-weight: 300; text-align: center; }

        /* 隱藏的原生播放器 */
        audio { display: none; }
    </style>
</head>
<body>

    <div class="turntable-base" id="player" onclick="togglePlay()">
        <div class="platter" id="platter">
            <div class="label">LIVE MUSIC</div>
        </div>
        <div class="tonearm"></div>
    </div>

    <div class="status-msg" id="status">
        感應成功！<br><strong>點擊唱機</strong> 播放專屬音樂
    </div>

    <audio id="myAudio" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('myAudio');
        const player = document.getElementById('player');
        const platter = document.getElementById('platter');
        const status = document.getElementById('status');
        let isPlaying = false;

        function togglePlay() {
            if (!isPlaying) {
                audio.play();
                player.classList.add('playing');
                platter.classList.add('spinning');
                status.innerHTML = "🎶 正在播放中...<br>再次點擊可停止";
                isPlaying = true;
            } else {
                audio.pause();
                player.classList.remove('playing');
                platter.classList.remove('spinning');
                status.innerHTML = "音樂已暫停<br>點擊唱機繼續播放";
                isPlaying = false;
            }
        }
    </script>
</body>
</html>
